<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Weather app</title>
</head>
<body>
<div id="weather-bg" class="start-screen">
    <div class="weather-layer clear-day"></div>
    <div class="weather-layer clear-night"></div>
    <div class="weather-layer partly-cloudy-day"></div>
    <div class="weather-layer partly-cloudy-night"></div>
    <div class="weather-layer cloudy"></div>
    <div class="weather-layer rain"></div>
    <div class="weather-layer snow"></div>
    <div class="weather-layer fog"></div>
    <div class="weather-layer wind"></div>
    <div class="sun"></div>
</div>
    <main>
        <p id="looktext">Let's look for a weather?</p>
        <div class="top-controls">
            <div id="background-controls" hidden>
                <p>Take a look at other backgrounds</p>

                <button type="button" data-background="clear-day">
                    Clear day
                </button>

                <button type="button" data-background="clear-night">
                    Clear night
                </button>
                <button type="button" data-background="partly-cloudy-day">
                    Partly cloudy day
                </button>
                <button type="button" data-background="partly-cloudy-night">
                    Partly cloudy night
                </button>
                <button type="button" data-background="cloudy">
                    Cloudy
                </button>
                <button type="button" data-background="rain">
                    Rain
                </button>
                <button type="button" data-background="snow">
                    Snow
                </button>
                <button type="button" data-background="fog">
                    Fog
                </button>
                <button type="button" data-background="wind">
                    Wind
                </button>
            </div>

            <div id="controls">
                <form>
                    <div class="search-box">
                        <input
                                id="input"
                                type="text"
                                placeholder="Enter a city"
                                autocomplete="off"
                        >

                        <div id="suggestions"></div>
                    </div>

                    <button type="submit">Submit</button>
                </form>

            </div>
        </div>

        <div id="weather">
                <div id="mainInfo">
                    <h1 id="location"></h1>
                    <p id="temperature"></p>
                    <p id="condition"></p>
                    <p id="feelslike"></p>
                    <p id="icon" alt=""></p>
                </div>
                <div id="detailsInfo">
                        <div>
                            <p>Humidity</p>
                            <p id="humidity"></p>
                        </div>
                        <div>
                            <p>Windspeed</p>
                            <p id="windspeed"></p>
                        </div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="unit-toggle">
                    <span class="slider"></span>
                    <span>Celsius</span>
                </label>
            </div>
        <p id="gitlink">
            GitHub:
            <a
                    href="https://github.com/nickbelov69"
                    target="_blank"
                    rel="noopener noreferrer"
            >
                @nickbelov69
            </a>
        </p>
    </main>
</body>
</html>
